# =====================================================================
#  publier.yml : fichier de publication commun à tous les projets du site
#  À placer dans chaque dépôt GitHub, sous : .github/workflows/publier.yml
#
#  À chaque envoi (Push) depuis Overleaf, il convertit le LaTeX en page web
#  et la publie sur GitHub Pages :
#    - classe book  -> un livre en ligne (une page par chapitre, sommaire) ;
#    - autre classe -> une seule page (accueil, CV…).
#  Dans le projet d'accueil (celui qui contient menu.txt), il publie en plus
#  le style, la police et le menu partagés par toutes les pages.
# =====================================================================
name: Publier la page web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# ---- À MODIFIER : le nom affiché en haut à gauche de chaque page ----
env:
  NOM_DU_SITE: "Victor De Bono"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet Overleaf
        uses: actions/checkout@v4

      - name: Installer Pandoc, la police Latin Modern et l'outil de conversion des PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc fonts-lmodern poppler-utils

      - name: Construire la page web
        run: |
          # Fichier LaTeX principal : main.tex, sinon le premier fichier avec \documentclass
          if [ -f main.tex ]; then TEX=main.tex; else TEX=$(grep -l '\\documentclass' *.tex | head -n 1); fi
          echo "Fichier principal : $TEX"
          mkdir -p _site

          # Images utilisées dans le document (PNG, JPG, SVG, GIF)
          find . \( -path ./_site -o -path ./_construction -o -path ./.git \) -prune -o -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.gif' \) -print \
            | while read -r f; do mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done

          python3 -c 'import html, os; print("<nav class=\"barre\" id=\"menu\"><a class=\"nom\" href=\"/\">%s</a><span class=\"liens\"></span></nav>" % html.escape(os.environ["NOM_DU_SITE"]))' > entete.html
          cat > tete.html <<'EOF'
          <link rel="stylesheet" href="/commun/style.css">
          <script src="/commun/menu.js" defer></script>
          EOF

          if grep -qE '\\documentclass(\[[^]]*\])?\{book\}' "$TEX"; then
            # Classe book : un livre en ligne (une page par chapitre, sommaire latéral)
            cat > livre.py <<'FIN_LIVRE'
          #!/usr/bin/env python3
          """Convertit un livre LaTeX (classe book) en site web paginé, façon bookdown.

          - une page par chapitre, sommaire latéral (parties, chapitres, sections) ;
          - numérotation des chapitres, sections, équations, figures et exercices
            identique au PDF (numérotation par chapitre) ;
          - renvois \\ref et \\eqref actifs d'une page à l'autre ;
          - exercices encadrés, corrigés dépliables ;
          - pages précédente / suivante.

          Usage : python3 livre.py main.tex _site
          """
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import unicodedata

          SOURCE, SORTIE = sys.argv[1], sys.argv[2]
          RACINE = os.path.dirname(os.path.abspath(SOURCE))


          # ---------------------------------------------------------------------------
          # 1. Assembler le source (\input, \include) et étiqueter les équations
          # ---------------------------------------------------------------------------
          def lire(chemin):
              if not chemin.endswith(".tex"):
                  chemin += ".tex"
              with open(os.path.join(RACINE, chemin), encoding="utf-8") as f:
                  texte = f.read()
              sortie = []
              for ligne in texte.splitlines(keepends=True):
                  code = re.split(r"(?<!\\)%", ligne, maxsplit=1)[0]
                  m = re.search(r"\\(?:input|include)\{([^}]+)\}", code)
                  if m:
                      sortie.append(code[: m.start()] + lire(m.group(1)) + code[m.end():] + "\n")
                  else:
                      sortie.append(ligne)
              return "".join(sortie)


          source = lire(os.path.basename(SOURCE))


          # Figures en PDF : converties en SVG (vectoriel) pour le web, en gardant la largeur demandée.
          def figure_web(m):
              options, chemin = m.group(1) or "", m.group(2).strip()
              trouve = None
              for candidat in [chemin] + [chemin + e for e in (".pdf", ".PDF", ".png", ".jpg", ".jpeg", ".svg")]:
                  if os.path.isfile(os.path.join(RACINE, candidat)):
                      trouve = candidat
                      break
              if not trouve or not trouve.lower().endswith(".pdf"):
                  return m.group(0)
              svg = os.path.splitext(trouve)[0] + ".svg"
              cible = os.path.join(SORTIE, svg)
              if not os.path.exists(cible):
                  os.makedirs(os.path.dirname(cible) or ".", exist_ok=True)
                  subprocess.run(["pdftocairo", "-svg", "-f", "1", "-l", "1", os.path.join(RACINE, trouve), cible], check=True)
                  print("Figure convertie : %s -> %s" % (trouve, svg))
              return "\\includegraphics%s{%s}" % (options, svg)


          source = re.sub(r"\\includegraphics\s*(\[[^\]]*\])?\s*\{([^}]+)\}", figure_web, source)

          # Toute équation numérotée (environnement equation) reçoit une étiquette,
          # même sans \label, pour que la numérotation web suive celle du PDF.
          compteur_auto = [0]


          def etiqueter(m):
              corps = m.group(1)
              if "\\label" not in corps:
                  compteur_auto[0] += 1
                  corps += "\\label{eq-auto-%d}" % compteur_auto[0]
              return "\\begin{equation}" + corps + "\\end{equation}"


          source = re.sub(r"\\begin\{equation\}(.*?)\\end\{equation\}", etiqueter, source, flags=re.S)

          # Chapitres numérotés dans leur partie ? (\counterwithin{chapter}{part} dans le préambule)
          sans_commentaires = re.sub(r"(?<!\\)%.*", "", source)
          m = re.search(r"\\counterwithin(\*?)\{chapter\}\{part\}", sans_commentaires)
          CHAP_PAR_PARTIE = bool(m)            # la numérotation repart à 1 à chaque partie
          CHAP_PREFIXE = bool(m) and not m.group(1)   # et le numéro de partie précède : II.1

          # Parties en chiffres arabes ? (\renewcommand{\thepart}{\arabic{part}} dans le préambule)
          PARTIES_ARABES = bool(re.search(r"\\renewcommand\s*\{?\\thepart\}?\s*\{\s*\\arabic\s*\{part\}\s*\}", sans_commentaires))

          # Nom affiché en haut à gauche de chaque page (réglé dans publier.yml)
          NOM_SITE = html.escape(os.environ.get("NOM_DU_SITE", ""))

          # ---------------------------------------------------------------------------
          # Bibliographie (biblatex : \addbibresource ; BibTeX : \bibliography)
          #   \cite, \textcite, \parencite… -> citation auteur-année, liée à la bibliographie
          #   \footcite                     -> note de bas de page avec citation courte
          #   \footfullcite                 -> note de bas de page avec la référence complète
          #   \printbibliography            -> page « Bibliographie » (comme dans le PDF)
          # ---------------------------------------------------------------------------
          BIBS = []
          for m in re.finditer(r"\\addbibresource\s*(?:\[[^\]]*\])?\s*\{([^}]+)\}", sans_commentaires):
              BIBS.append(m.group(1).strip())
          for m in re.finditer(r"\\bibliography\s*\{([^}]+)\}", sans_commentaires):
              for b in m.group(1).split(","):
                  b = b.strip()
                  BIBS.append(b if b.endswith(".bib") else b + ".bib")
          BIBS = [b for b in dict.fromkeys(BIBS) if os.path.exists(os.path.join(RACINE, b))]

          CITATIONS_PLEINES = []    # (clés, avant, après) de chaque \footfullcite
          MARQUE_BIBLIO = "ZZBIBLIOGRAPHIEZZ"

          if BIBS:
              def citation_pleine(m):
                  opts = [o for o in (m.group(1), m.group(2)) if o is not None]
                  avant, apres = (opts[0], opts[1]) if len(opts) == 2 else ("", opts[0] if opts else "")
                  avant, apres = avant.replace("~", "\u00a0"), apres.replace("~", "\u00a0")
                  CITATIONS_PLEINES.append(([k.strip() for k in m.group(3).split(",")], avant, apres))
                  return "\\footnote{ZZBIBPLEINE%dZZ}" % (len(CITATIONS_PLEINES) - 1)

              source = re.sub(r"\\footfullcite\s*(?:\[([^\]]*)\])?\s*(?:\[([^\]]*)\])?\s*\{([^}]+)\}", citation_pleine, source)
              source = re.sub(r"\\footcite\s*((?:\[[^\]]*\]\s*){0,2})\{([^}]+)\}", r"\\footnote{\\cite\1{\2}}", source)

              def bibliographie(options):
                  options = options or ""
                  if "heading=none" in options.replace(" ", ""):
                      return "\n\n%s\n\n" % MARQUE_BIBLIO
                  t = re.search(r"title\s*=\s*\{([^}]*)\}", options)
                  return "\n\\chapter*{%s}\n\n%s\n\n" % (t.group(1) if t else "Bibliographie", MARQUE_BIBLIO)

              source = re.sub(r"\\printbibliography\s*(\[[^\]]*\])?", lambda m: bibliographie(m.group(1)), source)
              source = re.sub(r"\\bibliography\s*\{[^}]+\}", lambda m: bibliographie(""), source)

          os.makedirs("_construction", exist_ok=True)
          with open("_construction/complet.tex", "w", encoding="utf-8") as f:
              f.write(source)

          doc = json.loads(subprocess.run(
              ["pandoc", "_construction/complet.tex", "-f", "latex", "-t", "json"],
              check=True, capture_output=True, text=True).stdout)
          API = doc["pandoc-api-version"]


          def largeurs_web(x):
              """width=0.7\\linewidth -> 70 % de la largeur du texte sur le site."""
              if isinstance(x, dict):
                  if x.get("t") == "Image":
                      attributs = x["c"][0][2]
                      for i, (cle, valeur) in enumerate(attributs):
                          if cle in ("width", "height"):
                              m = re.fullmatch(r"\s*([0-9.]*)\s*\\(?:linewidth|textwidth|columnwidth|hsize)\s*", valeur)
                              if m:
                                  facteur = float(m.group(1)) if m.group(1) else 1.0
                                  attributs[i] = [cle, "%g%%" % min(100, round(facteur * 100, 1))]
                  for v in x.values():
                      largeurs_web(v)
              elif isinstance(x, list):
                  for v in x:
                      largeurs_web(v)


          largeurs_web(doc["blocks"])


          def pandoc_json(document, *options):
              return json.loads(subprocess.run(["pandoc", "-f", "json", "-t", "json", *options],
                                               input=json.dumps(document), check=True,
                                               capture_output=True, text=True).stdout)


          if BIBS:
              options_bib = ["--citeproc", "-M", "lang=fr"]
              for b in BIBS:
                  options_bib += ["--bibliography", os.path.join(RACINE, b)]

              # Emplacement de la bibliographie
              bib_affichee = False
              for i, b in enumerate(doc["blocks"]):
                  if b["t"] == "Para" and b["c"] == [{"t": "Str", "c": MARQUE_BIBLIO}]:
                      doc["blocks"][i] = {"t": "Div", "c": [["refs", [], []], []]}
                      bib_affichee = True

              # Les références citées seulement en note complète figurent aussi dans la bibliographie
              cles_pleines = sorted({k for cles, _, _ in CITATIONS_PLEINES for k in cles})
              if cles_pleines:
                  doc["meta"]["nocite"] = {"t": "MetaInlines", "c": [{"t": "Cite", "c": [
                      [{"citationId": k, "citationPrefix": [], "citationSuffix": [], "citationMode": {"t": "NormalCitation"},
                        "citationNoteNum": 0, "citationHash": 0} for k in cles_pleines], []]}]}

              doc = pandoc_json(doc, *options_bib,
                                *(["-M", "link-citations=true"] if bib_affichee else ["-M", "suppress-bibliography=true"]))

              # Références complètes, pour les \footfullcite
              if CITATIONS_PLEINES:
                  tout = {"pandoc-api-version": API, "blocks": [], "meta": {"nocite": {"t": "MetaInlines", "c": [{"t": "Cite", "c": [
                      [{"citationId": "*", "citationPrefix": [], "citationSuffix": [], "citationMode": {"t": "NormalCitation"},
                        "citationNoteNum": 0, "citationHash": 0}], []]}]}}}
                  entrees = {}

                  def lire_entrees(x):
                      if isinstance(x, dict):
                          if x.get("t") == "Div" and x["c"][0][0].startswith("ref-"):
                              blocs_entree = x["c"][1]
                              if blocs_entree and blocs_entree[0]["t"] in ("Para", "Plain"):
                                  entrees[x["c"][0][0][4:]] = blocs_entree[0]["c"]
                              return
                          for v in x.values():
                              lire_entrees(v)
                      elif isinstance(x, list):
                          for v in x:
                              lire_entrees(v)

                  lire_entrees(pandoc_json(tout, *options_bib)["blocks"])

                  def note_pleine(i):
                      cles, avant, apres = CITATIONS_PLEINES[i]
                      contenu = []
                      if avant:
                          contenu += [{"t": "Str", "c": avant}, {"t": "Space"}]
                      for j, k in enumerate(cles):
                          if j:
                              contenu += [{"t": "Str", "c": ";"}, {"t": "Space"}]
                          contenu += entrees.get(k, [{"t": "Str", "c": "[%s ?]" % k}])
                      if apres:
                          if contenu and contenu[-1].get("t") == "Str" and contenu[-1]["c"].endswith("."):
                              contenu[-1] = {"t": "Str", "c": contenu[-1]["c"][:-1]}
                          contenu += [{"t": "Str", "c": ","}, {"t": "Space"}, {"t": "Str", "c": apres + "."}]
                      return [{"t": "Para", "c": contenu}]

                  def remplacer_notes(x):
                      if isinstance(x, dict):
                          if x.get("t") == "Note":
                              texte = json.dumps(x["c"])
                              m = re.search(r"ZZBIBPLEINE(\d+)ZZ", texte)
                              if m:
                                  return {"t": "Note", "c": note_pleine(int(m.group(1)))}
                          return {k: remplacer_notes(v) for k, v in x.items()}
                      if isinstance(x, list):
                          return [remplacer_notes(v) for v in x]
                      return x

                  doc["blocks"] = remplacer_notes(doc["blocks"])


          # ---------------------------------------------------------------------------
          # Outils
          # ---------------------------------------------------------------------------
          def texte_de(inlines):
              """Texte brut d'une liste d'éléments en ligne."""
              morceaux = []

              def w(x):
                  if isinstance(x, dict):
                      t = x.get("t")
                      if t == "Str":
                          morceaux.append(x["c"])
                      elif t in ("Space", "SoftBreak", "LineBreak"):
                          morceaux.append(" ")
                      elif t == "Math":
                          morceaux.append(x["c"][1])
                      else:
                          w(x.get("c"))
                  elif isinstance(x, list):
                      for v in x:
                          w(v)

              w(inlines)
              return "".join(morceaux).strip()


          def str_(s):
              return {"t": "Str", "c": s}


          def span(classe, inlines):
              return {"t": "Span", "c": [["", [classe], []], inlines]}


          def slug(s):
              s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode()
              s = re.sub(r"[^a-zA-Z0-9]+", "-", s).strip("-").lower()
              return s or "page"


          def numero_partie(n):
              return str(n) if PARTIES_ARABES else romain(n)


          def romain(n):
              valeurs = [(10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]
              r = ""
              for v, l in valeurs:
                  while n >= v:
                      r, n = r + l, n - v
              return r


          # ---------------------------------------------------------------------------
          # 2. Numérotation
          # ---------------------------------------------------------------------------
          numeros = {}          # étiquette -> numéro affiché
          c = {"partie": 0, "chap": 0, "sec": 0, "ssec": 0, "eq": 0, "fig": 0, "ex": 0}
          chapitre_courant = ["0"]


          def numeroter_contenu(x):
              """Parcourt récursivement un élément et numérote équations, figures, exercices."""
              if isinstance(x, list):
                  resultat = []
                  for el in x:
                      r = numeroter_contenu(el)
                      if isinstance(r, list) and isinstance(el, dict) and el.get("t") == "Div":
                          resultat.extend(r)
                      else:
                          resultat.append(r)
                  return resultat
              if not isinstance(x, dict):
                  return x
              t = x.get("t")
              ch = chapitre_courant[0]

              if t == "Math" and x["c"][0]["t"] == "DisplayMath":
                  tex = x["c"][1]
                  etiquettes = re.findall(r"\\label\{([^}]+)\}", tex)
                  if etiquettes:
                      for e in etiquettes:
                          c["eq"] += 1
                          num = "%s.%d" % (ch, c["eq"])
                          numeros[e] = num
                          tex = tex.replace("\\label{%s}" % e, "\\tag{%s}" % num, 1)
                      x["c"][1] = tex
                      return {"t": "Span", "c": [[etiquettes[0], ["equation"], []], [x]]}
                  return x

              if t == "Figure":
                  attr, legende, contenu = x["c"]
                  c["fig"] += 1
                  num = "%s.%d" % (ch, c["fig"])
                  if attr[0]:
                      numeros[attr[0]] = num
                  if legende[1] and legende[1][0]["t"] in ("Plain", "Para"):
                      legende[1][0]["c"] = [span("numero", [str_("Figure %s" % num)]), str_(" :"), {"t": "Space"}] + legende[1][0]["c"]
                  x["c"] = [attr, legende, numeroter_contenu(contenu)]
                  return x

              if t == "Div":
                  attr, blocs = x["c"]
                  classes = attr[1]
                  blocs = numeroter_contenu(blocs)
                  if ("encadre" in classes or "block" in classes) and blocs and blocs[0]["t"] == "Para":
                      # Le titre de l'encadré ({Pour aller plus loin}) devient un paragraphe à part
                      premier = blocs[0]["c"]
                      if premier and premier[0]["t"] == "Span" and premier[0]["c"][0] == ["", [], []]:
                          titre = {"t": "Para", "c": premier[0]["c"][1]}
                          reste = premier[1:]
                          while reste and reste[0]["t"] in ("Space", "SoftBreak"):
                              reste = reste[1:]
                          blocs = [titre] + ([{"t": "Para", "c": reste}] if reste else []) + blocs[1:]
                  if "exercice" in classes or "corrige" in classes:
                      # Retirer l'en-tête « Exercice 1.1. » ajouté par Pandoc
                      if blocs and blocs[0]["t"] == "Para" and blocs[0]["c"] and blocs[0]["c"][0]["t"] == "Strong":
                          reste = blocs[0]["c"][1:]
                          while reste and (reste[0]["t"] == "Space" or (reste[0]["t"] == "Str" and reste[0]["c"] == ".")):
                              reste = reste[1:]
                          blocs[0]["c"] = reste
                      if "exercice" in classes:
                          c["ex"] += 1
                          num = "%s.%d" % (ch, c["ex"])
                          if attr[0]:
                              numeros[attr[0]] = num
                          titre = {"t": "Para", "c": [span("titre-encadre", [str_("Exercice %s" % num)])]}
                          return [{"t": "Div", "c": [[attr[0], ["exercice"], attr[2]], [titre] + blocs]}]
                      return [
                          {"t": "RawBlock", "c": ["html", '<details class="corrige"><summary>Corrigé</summary>']},
                          *blocs,
                          {"t": "RawBlock", "c": ["html", "</details>"]},
                      ]
                  x["c"] = [attr, blocs]
                  return x

              if "c" in x:
                  x["c"] = numeroter_contenu(x["c"])
              return x


          blocs = []
          for b in doc["blocks"]:
              if b["t"] == "Header":
                  niveau, attr, contenu = b["c"]
                  sans_numero = "unnumbered" in attr[1]
                  num = None
                  if niveau == 1:
                      c["partie"] += 1
                      if CHAP_PAR_PARTIE:
                          c["chap"] = 0
                      num = numero_partie(c["partie"])
                  elif niveau == 2 and not sans_numero:
                      c["chap"] += 1
                      c.update(sec=0, ssec=0, eq=0, fig=0, ex=0)
                      num = str(c["chap"])
                      if CHAP_PREFIXE and c["partie"] > 0:
                          num = "%s.%d" % (numero_partie(c["partie"]), c["chap"])
                      chapitre_courant[0] = num
                  elif niveau == 2:
                      c.update(sec=0, ssec=0, eq=0, fig=0, ex=0)
                      chapitre_courant[0] = "*"
                  elif niveau == 3 and not sans_numero and chapitre_courant[0] != "*":
                      c["sec"] += 1
                      c["ssec"] = 0
                      num = "%s.%d" % (chapitre_courant[0], c["sec"])
                  elif niveau == 4 and not sans_numero and chapitre_courant[0] != "*":
                      c["ssec"] += 1
                      num = "%s.%d.%d" % (chapitre_courant[0], c["sec"], c["ssec"])
                  if num:
                      if attr[0]:
                          numeros[attr[0]] = num
                      b["c"][2] = [span("numero", [str_(num)]), {"t": "Space"}] + contenu
                  blocs.append(b)
              else:
                  r = numeroter_contenu(b)
                  blocs.extend(r if isinstance(r, list) else [r])


          NUMERO_EN_TETE = r"^(?:[IVXLC0-9]+\.)?[0-9]+(?:\.[0-9]+)*\s+"

          # ---------------------------------------------------------------------------
          # 3. Découpage en pages (une par chapitre)
          # ---------------------------------------------------------------------------
          pages = [{"fichier": "index.html", "titre": "Accueil", "blocs": [], "partie": None, "couverture": True}]
          sommaire = []        # éléments : ("partie", texte) / ("chap", texte, page) / ("sec", texte, page, id)
          ids_page = {}        # id -> fichier
          partie_courante = None
          noms = set(["index"])

          for b in blocs:
              if b["t"] == "Header" and b["c"][0] == 1:
                  partie_courante = texte_de(b["c"][2])
                  sommaire.append(("partie", b["c"][2]))
                  continue
              if b["t"] == "Header" and b["c"][0] == 2:
                  titre = texte_de(b["c"][2])
                  nom = slug(re.sub(NUMERO_EN_TETE, "", titre))
                  base, i = nom, 2
                  while nom in noms:
                      nom, i = "%s-%d" % (base, i), i + 1
                  noms.add(nom)
                  pages.append({"fichier": nom + ".html", "titre": titre, "blocs": [], "partie": partie_courante})
                  sommaire.append(("chap", b["c"][2], nom + ".html"))
              elif b["t"] == "Header" and b["c"][0] == 3:
                  sommaire.append(("sec", b["c"][2], pages[-1]["fichier"], b["c"][1][0]))
              pages[-1]["blocs"].append(b)

          # Sans préface, pas de page de couverture : le site s'ouvre directement
          # sur le premier chapitre, qui devient index.html.
          if not pages[0]["blocs"] and len(pages) > 1:
              pages.pop(0)
              ancien = pages[0]["fichier"]
              pages[0]["fichier"] = "index.html"
              sommaire = [tuple("index.html" if v == ancien else v for v in el) if el[0] != "partie" else el
                          for el in sommaire]

          # Où se trouve chaque identifiant ?
          def collecter_ids(x, fichier):
              if isinstance(x, dict):
                  if x.get("t") in ("Header", "Div", "Span", "Figure", "Table", "CodeBlock"):
                      attr = x["c"][1] if x["t"] == "Header" else x["c"][0]
                      if isinstance(attr, list) and attr and isinstance(attr[0], str) and attr[0]:
                          ids_page[attr[0]] = fichier
                  for v in x.values():
                      collecter_ids(v, fichier)
              elif isinstance(x, list):
                  for v in x:
                      collecter_ids(v, fichier)


          for p in pages:
              collecter_ids(p["blocs"], p["fichier"])


          # ---------------------------------------------------------------------------
          # 4. Renvois (\ref, \eqref) : bon numéro et bonne page
          # ---------------------------------------------------------------------------
          def corriger_liens(x, fichier):
              if isinstance(x, dict):
                  if x.get("t") == "Link":
                      attr, contenu, (url, titre) = x["c"]
                      kv = dict(attr[2])
                      if "reference" in kv:
                          cible = kv["reference"]
                          num = numeros.get(cible, "??")
                          texte = "(%s)" % num if kv.get("reference-type") == "eqref" else num
                          x["c"][1] = [str_(texte)]
                          url = "#" + cible
                      if url.startswith("#"):
                          page = ids_page.get(url[1:], fichier)
                          x["c"][2] = [(url if page == fichier else page + url), titre]
                      return x
                  for k, v in x.items():
                      x[k] = corriger_liens(v, fichier)
              elif isinstance(x, list):
                  return [corriger_liens(v, fichier) for v in x]
              return x


          for p in pages:
              p["blocs"] = corriger_liens(p["blocs"], p["fichier"])


          # ---------------------------------------------------------------------------
          # 5. Conversion en HTML
          # ---------------------------------------------------------------------------
          def en_html(blocs_ou_inlines, en_ligne=False):
              if en_ligne:
                  blocs_ou_inlines = [{"t": "Plain", "c": blocs_ou_inlines}]
              d = {"pandoc-api-version": API, "meta": {}, "blocks": blocs_ou_inlines}
              return subprocess.run(["pandoc", "-f", "json", "-t", "html5", "--mathjax"],
                                    input=json.dumps(d), check=True, capture_output=True, text=True).stdout


          meta = doc["meta"]
          titre_livre = texte_de(meta.get("title", {}).get("c", [])) or "Cours"
          auteurs = ", ".join(texte_de(a["c"]) for a in meta.get("author", {}).get("c", []) if isinstance(a, dict))
          date = texte_de(meta.get("date", {}).get("c", []))

          # Sommaire HTML (le même sur toutes les pages, page active marquée)
          def sommaire_html(page_active):
              lignes, ouvert = ["<ul>"], False
              for el in sommaire:
                  if el[0] == "partie":
                      if ouvert:
                          lignes.append("</ul></li>")
                          ouvert = False
                      lignes.append('<li class="partie">%s</li>' % en_html(el[1], True).strip())
                  elif el[0] == "chap":
                      if ouvert:
                          lignes.append("</ul></li>")
                      actif = ' class="actif"' if el[2] == page_active else ""
                      lignes.append('<li class="chapitre"><a href="%s"%s>%s</a><ul>' % (el[2], actif, en_html(el[1], True).strip()))
                      ouvert = True
                  else:
                      lignes.append('<li class="section"><a href="%s#%s">%s</a></li>' % (el[2], el[3], en_html(el[1], True).strip()))
              if ouvert:
                  lignes.append("</ul></li>")
              lignes.append("</ul>")
              return "\n".join(lignes)


          GABARIT = """<!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{titre_page}</title>
          <link rel="stylesheet" href="/commun/style.css">
          <script src="/commun/menu.js" defer></script>
          <script>window.MathJax = {{ tex: {{ tags: "ams" }} }};</script>
          <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" defer></script>
          <style>
            body {{ max-width: 76rem; }}
            .livre {{ display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 3rem; align-items: start; }}
            .livre-sommaire {{ position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto;
                              font-size: .85rem; line-height: 1.35; padding-right: .5rem; border-right: 1px solid #ddd; }}
            .livre-sommaire summary {{ display: none; }}
            .livre-sommaire .titre-livre {{ display: block; font-weight: bold; text-decoration: none; margin-bottom: 1rem; font-size: .95rem; }}
            .livre-sommaire ul {{ list-style: none; margin: 0; padding: 0; }}
            .livre-sommaire li.partie {{ font-weight: bold; margin: 1.1rem 0 .4rem; text-transform: uppercase; font-size: .8rem; letter-spacing: .03em; }}
            .livre-sommaire li.chapitre > a {{ display: block; margin: .45rem 0 .15rem; text-decoration: none; }}
            .livre-sommaire li.chapitre > a.actif {{ font-weight: bold; }}
            .livre-sommaire li.section a {{ display: block; padding-left: 1rem; color: #555; text-decoration: none; margin: .1rem 0; }}
            .livre-sommaire a:hover {{ text-decoration: underline; }}
            .livre-contenu {{ max-width: 46rem; }}
            .livre-contenu h2 {{ font-size: 1.7rem; border: none; margin-top: 0; }}
            .livre-contenu h3 {{ font-size: 1.3rem; border-bottom: 1px solid #000; padding-bottom: .2rem; margin-top: 1.6rem; }}
            .livre-contenu h4 {{ font-size: 1.1rem; margin-top: 1.2rem; }}
            .livre-contenu .numero {{ margin-right: .3rem; }}
            .livre-contenu figcaption .numero {{ margin-right: 0; }}
            .titre-couverture {{ font-size: 2rem; line-height: 1.25; margin: 0 0 .5rem; border: none; }}
            .auteur-couverture {{ font-size: 1.1rem; margin: 0; }}
            .date-couverture {{ color: #555; margin: .2rem 0 2rem; }}
            .sommaire-complet ul {{ list-style: none; padding: 0; margin: 0; }}
            .sommaire-complet li.partie {{ font-weight: bold; margin: 1.6rem 0 .3rem; text-transform: uppercase; font-size: .9rem; letter-spacing: .03em; }}
            .sommaire-complet li.chapitre > a {{ display: block; margin: .35rem 0 .1rem; text-decoration: none; }}
            .sommaire-complet li.section a {{ display: block; padding-left: 1.4rem; font-size: .92rem; color: #444; text-decoration: none; }}
            .sommaire-complet a:hover {{ text-decoration: underline; }}
            span.equation {{ display: block; }}
            .footnotes {{ font-size: .88rem; margin-top: 2.5rem; }}
            .footnotes hr {{ width: 30%; margin-left: 0; border: 0; border-top: 1px solid #000; }}
            .footnote-ref sup {{ font-size: .75em; }}
            #refs .csl-entry {{ padding-left: 1.6em; text-indent: -1.6em; margin-bottom: .6em; }}
            .exercice {{ border: 1px solid #000; border-left-width: 3px; padding: .2rem 1rem; margin: 1.5rem 0 .5rem; }}
            .encadre, .block {{ border: 1px solid #000; padding: 0 1rem .2rem; margin: 1.5rem 0; }}
            .encadre > p:first-child, .block > p:first-child {{ font-weight: bold; margin: 0 -1rem .6rem; padding: .35rem 1rem;
                                                               background: #ececec; border-bottom: 1px solid #000; }}
            .exercice .titre-encadre {{ font-weight: bold; }}
            details.corrige {{ border: 1px solid #000; border-left-width: 3px; padding: .5rem 1rem; margin: 0 0 1.5rem; }}
            details.corrige summary {{ cursor: pointer; font-weight: bold; }}
            .pages-voisines {{ display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid #000;
                              margin-top: 3rem; padding-top: 1rem; font-size: .95rem; }}
            .pages-voisines a {{ text-decoration: none; }}
            .pages-voisines a:hover {{ text-decoration: underline; }}
            @media (max-width: 900px) {{
              .livre {{ display: block; }}
              .livre-sommaire {{ position: static; max-height: none; border: 1px solid #000; padding: .6rem 1rem; margin-bottom: 2rem; }}
              .livre-sommaire summary {{ display: list-item; cursor: pointer; font-weight: bold; }}
              .livre-sommaire:not([open]) > :not(summary) {{ display: none; }}
            }}
          </style>
          </head>
          <body>
          <nav class="barre" id="menu"><a class="nom" href="/">{nom_site}</a><span class="liens"></span></nav>
          <div class="livre">
          <details class="livre-sommaire" open>
          <summary>Sommaire</summary>
          <a class="titre-livre" href="index.html">{titre_livre}</a>
          {sommaire}
          </details>
          <main class="livre-contenu">
          {contenu}
          <nav class="pages-voisines"><span>{precedent}</span><span>{suivant}</span></nav>
          </main>
          </div>
          <script>
            // Sur grand écran le sommaire reste ouvert ; sur téléphone il est replié par défaut.
            if (window.matchMedia("(max-width: 900px)").matches) document.querySelector(".livre-sommaire").removeAttribute("open");
          </script>
          </body>
          </html>
          """

          os.makedirs(SORTIE, exist_ok=True)
          for i, p in enumerate(pages):
              contenu = en_html(p["blocs"])
              if p.get("couverture"):
                  couverture = '<h1 class="titre-couverture">%s</h1>' % html.escape(titre_livre)
                  if auteurs:
                      couverture += '<p class="auteur-couverture">%s</p>' % html.escape(auteurs)
                  if date:
                      couverture += '<p class="date-couverture">%s</p>' % html.escape(date)
                  if not p["blocs"]:
                      # Pas de préface : la page d'accueil du cours affiche le sommaire complet
                      contenu = '<div class="sommaire-complet">%s</div>' % sommaire_html(None)
                  contenu = couverture + contenu
                  titre_page = titre_livre
              else:
                  titre_page = "%s · %s" % (re.sub(NUMERO_EN_TETE, "", p["titre"]), titre_livre)
              precedent = '<a href="%s">← %s</a>' % (pages[i - 1]["fichier"], html.escape(pages[i - 1]["titre"])) if i > 0 else ""
              suivant = '<a href="%s">%s →</a>' % (pages[i + 1]["fichier"], html.escape(pages[i + 1]["titre"])) if i + 1 < len(pages) else ""
              with open(os.path.join(SORTIE, p["fichier"]), "w", encoding="utf-8") as f:
                  f.write(GABARIT.format(nom_site=NOM_SITE, titre_page=html.escape(titre_page), titre_livre=html.escape(titre_livre),
                                         sommaire=sommaire_html(p["fichier"]), contenu=contenu,
                                         precedent=precedent, suivant=suivant))

          print("%d pages écrites dans %s" % (len(pages), SORTIE))
          FIN_LIVRE
            python3 livre.py "$TEX" _site
          else
            # Autre classe (article…) : une seule page
            pandoc "$TEX" -f latex -t html5 -s --mathjax -V lang=fr \
              --include-in-header tete.html --include-before-body entete.html -o _site/index.html
          fi

          # Figures que le navigateur ne sait pas lire (PDF, chemins sans extension)
          cat > figures.py <<'FIN_FIGURES'
          #!/usr/bin/env python3
          """Rend affichables sur le web les figures que le navigateur ne sait pas lire.

          - Figure en PDF (\\includegraphics{figures/8.pdf}) : convertie en SVG
            (image vectorielle, nette à tous les zooms) avec pdftocairo.
          - Figure sans extension (\\includegraphics{figures/8}) : on cherche le
            fichier réel (.png, .jpg, .svg, .pdf…), comme le fait LaTeX.

          Usage : python3 figures.py _site
          """
          import html
          import os
          import re
          import subprocess
          import sys

          SITE = sys.argv[1]
          EXTENSIONS = [".png", ".jpg", ".jpeg", ".svg", ".gif", ".pdf"]
          deja_converties = {}


          def fichier_source(chemin):
              """Retrouve le fichier image dans le projet (avec ou sans extension)."""
              chemin = chemin.lstrip("./")
              if os.path.splitext(chemin)[1].lower() in EXTENSIONS and os.path.isfile(chemin):
                  return chemin
              for e in EXTENSIONS + [e.upper() for e in EXTENSIONS]:
                  if os.path.isfile(chemin + e):
                      return chemin + e
              return None


          def version_web(chemin):
              """Chemin de l'image à afficher sur le site, après conversion si besoin."""
              source = fichier_source(chemin)
              if source is None:
                  print("Figure introuvable : %s" % chemin)
                  return chemin
              if not source.lower().endswith(".pdf"):
                  cible = os.path.join(SITE, source)
                  if not os.path.exists(cible):
                      os.makedirs(os.path.dirname(cible) or ".", exist_ok=True)
                      with open(source, "rb") as a, open(cible, "wb") as b:
                          b.write(a.read())
                  return source
              if source not in deja_converties:
                  svg = os.path.splitext(source)[0] + ".svg"
                  cible = os.path.join(SITE, svg)
                  os.makedirs(os.path.dirname(cible) or ".", exist_ok=True)
                  subprocess.run(["pdftocairo", "-svg", "-f", "1", "-l", "1", source, cible], check=True)
                  print("Figure convertie : %s -> %s" % (source, svg))
                  deja_converties[source] = svg
              return deja_converties[source]


          def corriger(m):
              balise, attributs = m.group(1), m.group(2)
              src = re.search(r'src="([^"]*)"', attributs)
              if not src:
                  return m.group(0)
              chemin = html.unescape(src.group(1))
              if re.match(r"^[a-z]+:", chemin):          # image distante (https://…)
                  return m.group(0)
              if balise == "img" and os.path.splitext(chemin)[1].lower() in EXTENSIONS[:-1]:
                  return m.group(0)                      # déjà une image web
              nouveau = version_web(chemin)
              attributs = attributs.replace(src.group(0), 'src="%s"' % html.escape(nouveau))
              if balise == "embed" and 'alt="' not in attributs:
                  attributs = attributs.rstrip(" /") + ' alt=""'
              return "<img%s />" % attributs.rstrip(" /")


          for nom in os.listdir(SITE):
              if not nom.endswith(".html"):
                  continue
              page = os.path.join(SITE, nom)
              with open(page, encoding="utf-8") as f:
                  contenu = f.read()
              nouveau = re.sub(r"<(img|embed)(\s[^>]*?)\s*/?>", corriger, contenu)
              if nouveau != contenu:
                  with open(page, "w", encoding="utf-8") as f:
                      f.write(nouveau)
          FIN_FIGURES
          python3 figures.py _site

          # ---------- Éléments partagés : seulement dans le projet d'accueil ----------
          if [ -f menu.txt ]; then
            cp menu.txt _site/menu.txt
            mkdir -p _site/commun/fonts
            cp /usr/share/texmf/fonts/opentype/public/lm/lmroman10-{regular,italic,bold,bolditalic}.otf _site/commun/fonts/

            cat > _site/commun/style.css <<'EOF'
          @font-face { font-family: "LM"; src: url("fonts/lmroman10-regular.otf"); }
          @font-face { font-family: "LM"; src: url("fonts/lmroman10-italic.otf"); font-style: italic; }
          @font-face { font-family: "LM"; src: url("fonts/lmroman10-bold.otf"); font-weight: bold; }
          @font-face { font-family: "LM"; src: url("fonts/lmroman10-bolditalic.otf"); font-weight: bold; font-style: italic; }
          html { font-size: 16px; background: #fff; }
          body { font-family: "LM", Georgia, serif; line-height: 1.45; color: #111; background: #fff;
                 max-width: 48rem; margin: 0 auto; padding: 0 16px 4rem; }
          a { color: #000; text-underline-offset: 0.18em; }
          img { max-width: 100%; height: auto; }
          header#title-block-header { display: none; }
          .barre { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
                   gap: .5rem 1.5rem; border-bottom: 1px solid #000; padding: 1rem 0 .6rem; margin-bottom: 2rem;
                   min-height: 1.6rem; }
          .barre a { text-decoration: none; }
          .barre .nom { font-size: 1.25rem; }
          .barre .liens a { margin-left: 1.2rem; }
          .barre .liens a.actif { border-bottom: 2px solid #000; }
          .center { text-align: center; }
          .center strong:first-child { font-size: 1.8rem; }
          h1 { font-size: 1.35rem; border-bottom: 1px solid #000; padding-bottom: .25rem; margin-top: 1.8rem; }
          h2 { font-size: 1.1rem; margin-top: 1.3rem; }
          figure { margin: 1.5rem 0; text-align: center; }
          figcaption { font-size: .9rem; }
          dl { display: grid; grid-template-columns: 8rem 1fr; column-gap: 1rem; }
          dt { font-weight: bold; font-size: .9rem; padding-top: .15rem; }
          dd { margin: 0 0 .9rem; }
          dd p { margin: 0; }
          dd ul { margin: .3rem 0; padding-left: 1.1rem; }
          @media (max-width: 576px) {
            dl { display: block; }
            dd { margin-left: 0; }
            .barre .liens a { margin: 0 1.2rem 0 0; }
          }
          EOF

            cat > _site/commun/menu.js <<'EOF'
          // Remplit la barre de navigation à partir de /menu.txt (projet d'accueil)
          (function () {
            var cible = document.querySelector("#menu .liens");
            if (!cible) return;
            fetch("/menu.txt", { cache: "no-cache" })
              .then(function (r) { return r.ok ? r.text() : ""; })
              .then(function (texte) {
                var ici = location.pathname;
                texte.split(/\r?\n/).forEach(function (ligne) {
                  ligne = ligne.trim();
                  if (!ligne || ligne.charAt(0) === "%" || ligne.indexOf("|") < 0) return;
                  var morceaux = ligne.split("|");
                  var a = document.createElement("a");
                  a.textContent = morceaux[0].trim();
                  a.href = morceaux.slice(1).join("|").trim();
                  var cheminLien = new URL(a.href, location.href).pathname;
                  var actif = cheminLien === "/" ? (ici === "/" || ici === "/index.html")
                                                 : ici.indexOf(cheminLien) === 0;
                  if (actif) a.className = "actif";
                  cible.appendChild(a);
                });
              })
              .catch(function () {});
          })();
          EOF
          fi

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
